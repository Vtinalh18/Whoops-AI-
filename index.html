        </section>
        <section class="card" aria-labelledby="h-tl"><h2 id="h-tl" style="font-size:15px">Línea de tiempo</h2>
          <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">${Object.entries(months).slice(-4).map(([m, rs], i, arr) => `<div style="display:flex;flex-direction:column;gap:10px"><div class="row" style="padding-bottom:8px;border-bottom:2px solid ${i === arr.length - 1 ? 'var(--mint)' : 'var(--line2)'}"><b style="font-weight:600;font-size:13px;text-transform:capitalize">${esc(m)}</b><span class="small muted">${rs.length} ${rs.length === 1 ? 'ad' : 'ads'}</span></div>
            ${rs.map((r) => `<button data-act="ref-open" data-id="${r.id}" style="border:0;padding:0;background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px"><span style="display:block;border-radius:10px;overflow:hidden;background:var(--lav-tint);max-height:200px">${r.blob ? `<img src="${refURL(r)}" alt="Ad de ${esc(r.brand)}" style="width:100%;display:block;max-height:200px;object-fit:cover">` : '<span style="display:block;height:80px"></span>'}</span><span class="row" style="gap:4px">${(r.tags || []).filter((t) => t.t === 'angle' || t.t === 'format').map((t) => tagChip(t)).join('')}</span></button>`).join('')}</div>`).join('')}</div>
          ${Object.keys(months).length > 4 ? '<span class="small muted">Mostrando los últimos 4 meses.</span>' : ''}
        </section>
      </div></div>`;
}
ACTIONS['brand-sel'] = (t) => { S.brandName = t.dataset.name; render(); };
ACTIONS['brand-sum'] = async (t) => {
  const name = t.dataset.name;
  const refs = S.refs.filter((r) => r.brand && r.brand.toLowerCase() === name.toLowerCase() && r.analysis).sort((a, b) => a.created - b.created);
  S.busy = 'brand'; S.error = null; render();
  try {
    const out = await geminiJSON([{ text: `Eres estratega de paid ads. Estos son ads de la marca ${name}, en orden de fecha:\n${refs.map((r) => `- ${new Date(r.created).toISOString().slice(0, 10)} (${r.source}): hook ${r.analysis.Hook}; ángulo ${r.analysis['Ángulo de venta']}; copy ${r.analysis.Copy}; CTA ${r.analysis.CTA}; formato ${r.analysis.Formato}`).join('\n')}\nResume en español, una frase corta por campo, cómo cambiaron en el tiempo su mensaje, sus ofertas y sus formatos. Si no hay cambio claro, dilo. Responde solo JSON: {"mensaje":"...","ofertas":"...","formatos":"..."}` }]);
    let b = S.brands.find((x) => x.name.toLowerCase() === name.toLowerCase());
    if (!b) b = { id: uid(), name, followed: false, created: Date.now() };
    b.summary = { mensaje: String(out.mensaje || ''), ofertas: String(out.ofertas || ''), formatos: String(out.formatos || ''), at: Date.now() };
    await DB.put('brands', b);
  } catch (e) { S.error = e.message; }
  S.busy = false; await reloadData(); render();
};

/* ---- Pregúntale a la IA ---- */
const QA_SUGGEST = ['¿Qué es el CTR y qué es un buen número?', 'Diferencia entre campañas de awareness y de conversión', '¿Por qué el UGC funciona en TikTok?', '¿Qué es un hook de patrón interrumpido y cuándo usarlo?'];
function viewPregunta() {
  const msgs = S.qa.map((m) => {
    if (m.role === 'user') return `<div class="msg u" style="max-width:70%">${esc(m.text)}</div>`;
    const ex = S.refs.filter((r) => (m.refIds || []).includes(r.id));
    return `<div style="align-self:flex-start;max-width:88%;display:flex;flex-direction:column;gap:10px">
      <div class="row">${aiChip('Gemini', 12)}</div>
      <div style="white-space:pre-wrap;font-size:14px;line-height:1.6">${esc(m.text)}</div>
      ${ex.length ? `<div style="padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--bg);display:flex;flex-direction:column;gap:8px"><span class="small muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.04em">Ejemplos de tu swipe file</span>
        <div class="grid3" style="gap:10px">${ex.map((r) => `<button data-act="ref-open" data-id="${r.id}" style="border:0;padding:0;background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600"><span style="display:block;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--lav-tint)">${r.blob ? `<img src="${refURL(r)}" alt="" style="width:100%;height:100%;object-fit:cover">` : ''}</span>${esc(r.brand || '')} · ${esc(r.source)}</button>`).join('')}</div></div>` : ''}
      ${m.saved ? '<span class="status ok" style="align-self:flex-start">✓ Guardado en lo aprendido</span>' : `<div class="row"><button class="btn sm" style="border-color:var(--lav);color:var(--purple);font-weight:600" data-act="qa-save" data-i="${S.qa.indexOf(m)}">Guardar en lo aprendido</button>
        <button class="btn sm" data-act="qa-fw" data-i="${S.qa.indexOf(m)}">Guardar como framework</button><button class="btn sm" data-act="qa-apply" data-i="${S.qa.indexOf(m)}">Aplicar a un concepto</button></div>`}
    </div>`;
  }).join('');
  return topBar('Pregúntale a la IA', `<button class="btn sm" data-act="qa-new">Nueva conversación</button>`) +
    (S.error ? `<div class="alert err" role="alert">${esc(S.error)}</div>` : '') +
    `<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
      <section class="card" style="flex:999 1 560px;min-width:0;min-height:600px;padding:0;gap:0" aria-label="Conversación">
        <div class="chat" id="qachat" style="flex:1;padding:24px 28px;max-height:640px">${msgs || `<div class="empty"><span>Pregunta sobre marketing, performance o creatividad.<br>La IA responde usando ejemplos de tu propio swipe file.</span></div>`}${S.busy === 'qa' ? '<div class="msg a"><span class="spin"></span></div>' : ''}</div>
        <div class="row" style="gap:6px;padding:0 24px 12px">${QA_SUGGEST.map((q) => `<button class="btn sm" data-act="qa-ask" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
        <form class="row" style="flex-wrap:nowrap;padding:14px 18px;border-top:1px solid var(--line)" data-qa>
          <label style="flex:1;display:flex"><span class="sr">Pregunta</span><input class="input" id="qain" style="border-radius:999px" placeholder="Pregunta sobre marketing, performance o creatividad…" autocomplete="off"></label>
          <button class="iconbtn" style="background:var(--lav);border-color:var(--lav);color:var(--lav-ink);width:46px;height:46px" aria-label="Enviar" ${S.busy === 'qa' ? 'disabled' : ''}>${IC(I.right, 16)}</button></form>
      </section>
      <aside class="card" style="flex:1 1 280px;max-width:340px" aria-labelledby="h-learn"><h2 id="h-learn" style="font-size:15px">Lo que has aprendido</h2>
        ${S.notes.length ? S.notes.map((n) => `<div style="display:flex;gap:6px;align-items:flex-start"><button data-act="qa-note" data-id="${n.id}" style="flex:1;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px"><b style="font-weight:600;font-size:13px">${esc(n.topic || n.q)}</b><span class="small muted">${new Date(n.created).toLocaleDateString('es-CL', { dateStyle: 'medium' })}</span></button><button class="iconbtn" style="border:0;width:32px;height:32px;color:var(--muted)" aria-label="Eliminar" data-act="qa-note-del" data-id="${n.id}">${IC(I.x, 13)}</button></div>`).join('') : '<span class="small muted">Las respuestas que guardes quedan aquí para volver a leerlas.</span>'}
      </aside></div>`;
}
AFTER.pregunta = () => {
  const box = $('#qachat'); if (box) box.scrollTop = box.scrollHeight;
  const form = document.querySelector('[data-qa]');
  if (form) form.addEventListener('submit', (e) => { e.preventDefault(); const v = $('#qain').value.trim(); if (v) askAI(v); });
};
async function askAI(q) {
  if (!S.settings.apiKey) { toast('Conecta Gemini en Ajustes'); return; }
  S.qa.push({ role: 'user', text: q }); S.busy = 'qa'; S.error = null; render();
  const sw = S.refs.filter((r) => r.analysis).slice(0, 60).map((r) => `[${r.id}] ${r.brand || 'sin marca'} (${r.source}) · hook: ${r.analysis.Hook} · ángulo: ${r.analysis['Ángulo de venta']}`).join('\n');
  const hist = S.qa.slice(-8).map((m) => `${m.role === 'user' ? 'Diseñadora' : 'IA'}: ${m.text}`).join('\n');
  try {
    const out = await geminiJSON([{ text: `Eres mentor de una diseñadora gráfica especializada en paid ads, social media y performance. Explica de forma clara, práctica y con ejemplos, en español (ella escribe en español o spanglish). Máximo 180 palabras.
Su swipe file (usa sus ids para citar ejemplos relevantes, máximo 3; si ninguno aplica, deja la lista vacía):
${sw || '(vacío)'}
Conversación:
${hist}
Responde solo JSON: {"answer":"...","topic":"título corto del tema","refIds":["id"]}` }]);
    S.qa.push({ role: 'ai', text: String(out.answer || ''), topic: String(out.topic || q).slice(0, 60), refIds: Array.isArray(out.refIds) ? out.refIds : [], q });
  } catch (e) { S.error = e.message; }
  S.busy = false; render();
}
ACTIONS['qa-ask'] = (t) => askAI(t.dataset.v);
ACTIONS['qa-new'] = () => { S.qa = []; S.error = null; render(); };
ACTIONS['qa-save'] = async (t) => { const m = S.qa[+t.dataset.i]; await DB.put('notes', { id: uid(), q: m.q, a: m.text, topic: m.topic, refIds: m.refIds, created: Date.now() }); m.saved = true; await reloadData(); render(); toast('Guardado en lo aprendido'); };
ACTIONS['qa-note'] = (t) => { const n = S.notes.find((x) => x.id === t.dataset.id); S.qa = [{ role: 'user', text: n.q }, { role: 'ai', text: n.a, topic: n.topic, refIds: n.refIds || [], q: n.q, saved: true }]; render(); };
ACTIONS['qa-note-del'] = async (t) => { await DB.del('notes', t.dataset.id); await reloadData(); render(); };
ACTIONS['qa-fw'] = (t) => { const m = S.qa[+t.dataset.i]; ACTIONS['fw-add'](t, null, { type: 'hook', name: m.topic, desc: m.text.split(/(?<=\.)\s/)[0] }); };
ACTIONS['qa-apply'] = (t) => {
  const m = S.qa[+t.dataset.i];
  const cs = S.concepts.filter((c) => c.status !== 'descartado');
  if (!cs.length) { toast('Primero crea un concepto en Conceptos'); return; }
  modal({ title: 'Aplicar a un concepto', okLabel: 'Aplicar',
    body: `<label class="field"><span>Concepto</span><select class="input" name="c">${cs.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><p class="small muted" style="margin:0">Se le pedirá al chat del concepto que aplique este aprendizaje.</p>`,
    onOk: async (f) => { S.conceptId = f.c; go('concepto'); conceptChat(`Aplica este aprendizaje al concepto: ${m.text}`); } });
};

</script>
</body>
</html>
