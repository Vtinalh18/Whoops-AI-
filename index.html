<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Whoops AI!">
<meta name="mobile-web-app-capable" content="yes">
<title>Whoops AI!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --ink2:#27272A; --ink3:#3F3F46; --muted:#6B6B73; --muted2:#71717A;
  --line:#ECECEE; --line2:#E4E4E7; --bg:#F4F4F5; --bg2:#FAFAFA; --white:#FFFFFF;
  --lav:#D8C7FD; --lav-ink:#2E1A5C; --lav-tint:#EDE4FE; --purple:#4B2A8A;
  --mint:#56C89F; --mint-ink:#0B3B2C; --mint-tint:#E3F1EC; --mint-dark:#0B5A40;
  --sage:#B2D3C8; --sage-tint:#EAF4F0;
  --red:#8E2A20; --red-tint:#FBEAE8; --amber-tint:#FFF6E5; --amber-ink:#5C3700;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
a{color:var(--purple)}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:flex;min-height:100vh}

/* sidebar */
.side{flex:0 0 248px;background:#FAFAFA;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:32px;height:32px;border-radius:999px;background:var(--lav);color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.brand b{font-weight:600;font-size:18px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{padding:0 10px 6px;font-size:12px;font-weight:600;color:var(--muted2);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.navitem{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:999px;color:var(--ink3);text-decoration:none;font-size:14px;border:0;background:transparent;cursor:pointer;width:100%;text-align:left}
.navitem:hover{background:#F0F0F2}
.navitem.active{background:var(--lav-tint);color:var(--purple);font-weight:600}
.navitem svg{flex:0 0 18px}
.navsoon{display:flex;justify-content:space-between;align-items:center;min-height:34px;padding:0 10px;color:var(--muted2);font-size:14px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}
.client{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--ink3);cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.client:hover{background:#F0F0F2}
.client.sel{color:var(--ink);font-weight:600}
.camp{display:block;min-height:32px;padding:6px 10px 6px 34px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.camp:hover{background:#F0F0F2}
.camp.sel{background:var(--bg);color:var(--ink);font-weight:500}
.linkbtn{border:0;background:transparent;color:var(--purple);font-size:13px;font-weight:500;cursor:pointer;padding:6px 10px;text-align:left}
.usage{margin-top:auto;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12px}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--mint);border-radius:99px}

/* main */
.main{flex:1;min-width:0;padding:24px 32px 48px;background-color:var(--bg);background-image:radial-gradient(#D9D9DE 1px,transparent 1px);background-size:18px 18px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.crumb{font-size:13px;color:var(--muted)}
.crumb strong{color:var(--ink);font-weight:600}
h1{margin:4px 0 0;font-weight:600;font-size:22px;letter-spacing:-.01em}
h2{margin:0;font-size:16px;font-weight:600}
h3{margin:0;font-size:14px;font-weight:600}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,16,20,.04);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.tight{padding:14px;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.lbl{font-size:13px;font-weight:600}
.input,select.input,textarea.input{height:44px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;background:#fff;font-size:14px;width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:2px solid var(--lav);outline-offset:1px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#F7F7F8}
.btn.primary{background:var(--lav);border-color:var(--lav);color:var(--lav-ink);font-weight:600}
.btn.primary:hover{background:#CDB8FC}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--purple)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3)}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:44px;border:1px solid var(--line2);border-radius:10px;background:#fff;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--purple);background:var(--lav-tint);color:var(--purple);font-weight:600}
.tabs{align-self:flex-start;display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:#EEEEF0}
.tabs button{min-height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink3);display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{background:#fff;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.switch{width:44px;height:26px;border:0;border-radius:99px;background:#D4D4D8;position:relative;cursor:pointer;flex:0 0 44px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--mint)}
.switch[aria-checked="true"]::after{left:21px}

/* chips & tags */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:#fff;border:1px solid var(--line2);font-size:13px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0;width:18px;height:18px;line-height:1}
.chip.add{border-style:dashed;color:var(--purple);cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--ink3)}
.tag.lav{background:var(--lav-tint);color:var(--purple)}
.tag.mint{background:var(--mint-tint);color:var(--mint-dark)}
.status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--ink3)}
.status.ok{background:var(--mint-tint);color:var(--mint-dark)}
.status.warn{background:#FDF1DC;color:#7A4B00}
.status.bad{background:var(--red-tint);color:var(--red)}
.ai{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:4px 10px 4px 5px;border-radius:8px;font-size:13px;font-weight:600}
.ai .lg{width:22px;height:22px;border-radius:6px;background:#fff;border:1px solid rgba(0,0,0,.08);display:inline-flex;align-items:center;justify-content:center}
.ai .lg img{width:13px;height:13px;object-fit:contain}

/* prompt box */
.prompt{position:relative;border:1px solid var(--line2);border-radius:12px;padding:16px;background:var(--bg2);font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:13px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;min-height:110px}
.prompt[contenteditable="true"]:focus{outline:2px solid var(--lav)}
.suggest{border-radius:12px;padding:16px;background:var(--sage-tint);border:1px solid var(--sage);display:flex;flex-direction:column;gap:12px}

/* drop zones / thumbs */
.drop{border:1.5px dashed #D4D4D8;border-radius:12px;background:var(--bg2);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;padding:16px;font-size:13px;min-height:120px}
.drop.hot{border-color:var(--lav);background:#FAF7FD;color:var(--purple)}
.drop.over{background:var(--lav-tint)}
.thumb{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--lav-tint);flex:0 0 120px}
.img4x5{width:100%;aspect-ratio:4/5;border-radius:12px;object-fit:cover;background:var(--bg);display:block}
.imgbox{width:100%;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:contain;display:block}

/* tables / lists */
.mrow{display:grid;grid-template-columns:44px 32px 240px minmax(0,1fr) 150px 44px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bg)}
.mrow.head{font-size:12px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.04em;background:var(--bg2);border-bottom:1px solid var(--line)}
.mrow.sel{background:#FCFAFF}
.clamp{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* library */
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;position:relative}
.tile .imgwrap{position:relative;border-radius:10px;overflow:hidden}
.tile .chk{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.tile .mark{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.mark.ok{background:#1B7A5A;color:#fff}
.mark.bad{background:#fff;color:var(--red);border:1px solid #E7C3BE}
.tile .actions{display:flex;gap:6px;padding:0 4px 4px;flex-wrap:wrap}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(24,24,27,.32);display:flex;align-items:flex-start;justify-content:center;padding:72px 24px;z-index:50;overflow:auto}
.modal{width:100%;max-width:560px;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(16,16,20,.18);display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal .body{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:var(--bg2);border-radius:0 0 18px 18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18181B;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:14px;background:var(--amber-tint);border:1px solid #F3D9A4;color:var(--amber-ink);font-size:13px}
.alert.err{background:var(--red-tint);border-color:#E7C3BE;color:var(--red)}
.alert.info{background:var(--sage-tint);border-color:var(--sage);color:#1F3B33}
.spin{width:16px;height:16px;border-radius:99px;border:2px solid currentColor;border-right-color:transparent;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:48px 24px;color:var(--muted)}
kbd{font-family:inherit;font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line2);background:#fff}

/* ---- tablet ---- */
.menubtn{display:none}
.scrim{display:none}
@media (max-width:1100px){
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 10px 40px rgba(16,16,20,.18);height:100%}
  .app.nav-open .side{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(24,24,27,.28);z-index:39}
  .menubtn{display:inline-flex}
  .main{padding:16px 20px 40px}
}
@media (max-width:900px){
  .mrow{display:flex;flex-wrap:wrap;gap:8px 12px}
  .mrow.head{display:none}
  .mrow>:nth-child(2){display:none}
  .mrow>:nth-child(3){flex:1;min-width:0}
  .mrow>:nth-child(4){order:5;flex-basis:100%;padding-left:56px}
}
@media (hover:none){
  .navitem,.client,.camp{min-height:44px}
  .btn.sm{min-height:40px}
}

@media (max-width:820px){.capgrid{grid-template-columns:1fr!important}}
.chat{display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.5;overflow-y:auto}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--lav-tint);color:var(--lav-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--bg);color:var(--ink2);border-bottom-left-radius:4px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:12px 0;border-top:1px solid var(--bg);align-items:start}
.frow>span{font-size:13px;font-weight:600;color:var(--purple);padding-top:10px}
@media (max-width:820px){.frow{grid-template-columns:1fr;gap:6px}.frow>span{padding-top:0}}
.mapcard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(16,16,20,.06);padding:14px;display:flex;flex-direction:column;gap:9px;text-align:left;font:inherit;color:inherit;overflow:hidden;box-sizing:border-box}
button.mapcard{cursor:pointer}
button.mapcard:hover{border-color:var(--lav)}

</style>
</head>

</div>

function logoMark(name, px = 13) {
  const b = BRAND[name] || BRAND.Referencia;
  if (b.logo) return `<img src="${b.logo}" alt="" style="width:${px}px;height:${px}px;object-fit:contain">`;
  if (!MODELS.includes(name) && name !== 'Claude') return '';
  return `<span aria-hidden="true" style="width:${px + 2}px;height:${px + 2}px;border-radius:4px;background:${b.fg};color:#fff;font-size:${Math.round(px * 0.7)}px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1">${esc(name[0])}</span>`;
}
function aiChip(name, size = 13) {
  const b = BRAND[name] || BRAND.Referencia;
  const mk = logoMark(name, 13);
  const lg = mk ? `<span class="lg">${mk}</span>` : '';
  return `<span class="ai" style="background:${b.bg};color:${b.fg};font-size:${size}px">${lg}${esc(name)}</span>`;
}

}

/* ============ Base de datos local (IndexedDB) ============ */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('whoops-ai', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const name of ['clients', 'campaigns', 'sessions', 'images', 'recipes', 'refs', 'concepts', 'frameworks', 'brands', 'notes']) {
          if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, { keyPath: 'id' });
        }
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, mode);
      const st = t.objectStore(store);
      const out = fn(st);
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  all(store) { return DB.tx(store, 'readonly', (s) => s.getAll()); },
  get(store, id) { return DB.tx(store, 'readonly', (s) => s.get(id)); },
  put(store, obj) { return DB.tx(store, 'readwrite', (s) => s.put(obj)); },
  del(store, id) { return DB.tx(store, 'readwrite', (s) => s.delete(id)); },
  clear(store) { return DB.tx(store, 'readwrite', (s) => s.clear()); },
};

const urlCache = new Map();
function imgURL(img) {
  if (!img) return '';
  if (!urlCache.has(img.id)) urlCache.set(img.id, URL.createObjectURL(img.blob));
  return urlCache.get(img.id);
}
async function reloadData() {
  [S.clients, S.campaigns, S.recipes, S.images, S.sessions, S.refs, S.concepts, S.frameworks, S.brands, S.notes] = await Promise.all(
    ['clients', 'campaigns', 'recipes', 'images', 'sessions', 'refs', 'concepts', 'frameworks', 'brands', 'notes'].map((s) => DB.all(s)));
  S.refs.sort((a, b) => b.created - a.created);
  S.concepts.sort((a, b) => a.created - b.created);
  S.notes.sort((a, b) => b.created - a.created);
  S.clients.sort((a, b) => a.name.localeCompare(b.name));
  S.images.sort((a, b) => b.created - a.created);
  S.sessions.sort((a, b) => b.created - a.created);
}
const clientById = (id) => S.clients.find((c) => c.id === id);
const campaignById = (id) => S.campaigns.find((c) => c.id === id);
function ctxLabel() {
  const camp = campaignById(S.ctx.campaignId);
  const cli = clientById(camp ? camp.clientId : S.ctx.clientId);
  if (!cli) return 'General';
  return camp ? `${esc(cli.name)} / <strong>${esc(camp.name)}</strong>` : `<strong>${esc(cli.name)}</strong>`;
}

/* ============ Gemini API ============ */
class GeminiError extends Error {
  constructor(kind, msg) { super(msg); this.kind = kind; }
}
async function blobToBase64(blob) {
  const buf = await blob.arrayBuffer();
  let bin = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function base64ToBlob(b64, mime) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime || 'image/png' });
}
async function geminiCall(model, parts, config = {}) {
  const key = S.settings.apiKey.trim();
  if (!key) throw new GeminiError('nokey', 'Falta tu clave de Gemini. Agrégala en Ajustes.');
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: config }),
    });
  } catch (e) {
    throw new GeminiError('network', 'No se pudo conectar con Gemini. Revisa tu conexión a internet.');
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* respuesta sin cuerpo */ }
  if (!res.ok) {
    const m = (data.error && data.error.message) || '';
    if (res.status === 429) throw new GeminiError('limit', 'Llegaste al límite de Gemini por ahora. Espera un rato o usa un puente.');
    if (res.status === 400 && /API key/i.test(m)) throw new GeminiError('key', 'La clave de Gemini no es válida. Revísala en Ajustes.');
    if (res.status === 403) throw new GeminiError('key', 'Tu clave no tiene acceso a este modelo. Revisa Ajustes.');
    if (res.status === 404) throw new GeminiError('model', `El modelo «${model}» no está disponible. Elige otro en Ajustes.`);
    if (res.status === 503 || res.status === 500 || res.status === 504 || /high demand|overloaded|unavailable/i.test(m)) throw new GeminiError('busy', 'Gemini está saturado en este momento. Suele pasar a ratos; intenta de nuevo en unos minutos.');
    throw new GeminiError('other', 'Gemini respondió con un error: ' + (m || res.status));
  }
  if (data.promptFeedback && data.promptFeedback.blockReason) {
    throw new GeminiError('blocked', 'El modelo rechazó el pedido por sus filtros de seguridad. Ajusta el texto y vuelve a intentar.');
  }
  const cand = (data.candidates || [])[0];
  if (!cand || !cand.content) {
    throw new GeminiError('blocked', 'Gemini no devolvió resultado (posible filtro de seguridad). Ajusta el texto y vuelve a intentar.');
  }
  return cand.content.parts || [];
}
const TEXT_FALLBACKS = ['gemini-3.5-flash', 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-2.5-flash', 'gemini-2.5-flash-lite'];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
/* Pide texto a Gemini: reintenta si está saturado y, si sigue, prueba otros modelos gratuitos. */
async function geminiText(parts, config) {
  const chain = [S.settings.textModel, ...TEXT_FALLBACKS.filter((m) => m !== S.settings.textModel)];
  let last;
  for (const model of chain) {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const out = await geminiCall(model, parts, config);
        if (model !== S.settings.textModel) toast(`${S.settings.textModel} estaba saturado; usé ${model}.`, 3500);
        return out;
      } catch (e) {
        last = e;
        if (e.kind === 'busy' && attempt < 2) { toast('Gemini está saturado, reintentando…', 2000); await wait(attempt === 0 ? 1500 : 4000); continue; }
        break;
      }
    }
    if (!last || !['busy', 'limit', 'model'].includes(last.kind)) throw last;
  }
  if (last && last.kind === 'busy') throw new GeminiError('busy', 'Gemini está saturado en este momento. Probé con varios modelos y ninguno respondió; intenta de nuevo en unos minutos.');
  if (last && last.kind === 'limit') throw new GeminiError('limit', 'Llegaste al límite gratuito de Gemini por hoy en todos los modelos. Se reinicia mañana; mientras tanto puedes usar los puentes.');
  throw last;
}
async function geminiJSON(parts) {
  const out = await geminiText(parts, { responseMimeType: 'application/json', temperature: 0.8 });
  bumpUsage('text');
  const txt = out.filter((p) => p.text && !p.thought).map((p) => p.text).join('');
  try { return JSON.parse(txt); } catch (e) {
    const m = txt.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch (e2) { /* sigue abajo */ } }
    throw new GeminiError('parse', 'Gemini respondió en un formato inesperado. Intenta de nuevo.');
  }
}
async function geminiImage(prompt, aspectRatio, inputBlob) {
  const parts = [{ text: prompt }];
  if (inputBlob) parts.unshift({ inlineData: { mimeType: inputBlob.type || 'image/png', data: await blobToBase64(inputBlob) } });
  const config = { responseModalities: ['TEXT', 'IMAGE'] };
  if (aspectRatio) config.imageConfig = { aspectRatio };
  let out;
  for (let attempt = 0; ; attempt++) {
    try { out = await geminiCall(S.settings.imageModel, parts, config); break; } catch (e) {
      if (e.kind === 'busy' && attempt < 2) { toast('Gemini está saturado, reintentando…', 2000); await wait(attempt === 0 ? 2000 : 5000); continue; }
      throw e;
    }
  }
  const img = out.filter((p) => !p.thought).reverse().find((p) => p.inlineData && p.inlineData.data);
  if (!img) throw new GeminiError('noimage', 'Gemini no devolvió una imagen. Prueba ajustando el prompt.');
  bumpUsage('images');
  return base64ToBlob(img.inlineData.data, img.inlineData.mimeType);
}

function modal({ title, body, okLabel = 'Guardar', onOk }) {
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <header><h2 id="mt">${title}</h2><button class="iconbtn" data-close aria-label="Cerrar">${IC(I.x, 16)}</button></header>
    <form class="body">${body}</form>
    <footer><button class="btn" data-close type="button">Cancelar</button><button class="btn primary" data-ok type="button">${okLabel}</button></footer></div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); wrap.querySelector('[data-ok]').click(); });
  wrap.addEventListener('click', async (e) => {
    if (e.target === wrap || e.target.closest('[data-close]')) close();
    if (e.target.closest('[data-ok]')) {
      const form = wrap.querySelector('form');
      const ok = await onOk(Object.fromEntries(new FormData(form)), form);
      if (ok !== false) close();
    }
  });
  wrap.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  const first = wrap.querySelector('input,select,textarea');
  if (first) first.focus();
}

      `<button role="tab" aria-selected="${d.tab === t}" data-act="ptab" data-v="${t}" style="${t !== 'Base' && BRAND[t] ? `color:${BRAND[t].fg}` : ''}">${t !== 'Base' ? logoMark(t, 13) : ''}${t}</button>`).join('')}</div>
    <div class="prompt" contenteditable="true" lang="en" id="ptext" aria-label="Prompt editable">${esc(txt)}</div>
    <div class="row" style="justify-content:space-between"><span class="small muted">${d.tab === 'Base' ? 'Prompt base' : 'Adaptado para ' + esc(d.tab)} · puedes editarlo</span>
      <div class="row"><button class="btn sm" data-act="claude-polish">${logoMark('Claude', 12)}Pulir con Claude</button>
      <button class="btn sm" data-act="copy-prompt">${IC(I.copy, 14)}Copiar</button></div></div>
    <div class="suggest"><span class="small" style="font-weight:600;color:var(--mint-dark);text-transform:uppercase;letter-spacing:.04em">Sugerencia de modelo</span>
      <span>${aiChip(sug, 14)}</span><span style="font-size:13px">${esc(p.reason || '')}</span>
      <div class="row"><button class="btn primary" data-act="to-compare" data-model="${sug}">Generar en ${esc(sug)}</button>
        <button class="btn" data-act="to-compare">Comparar en varios modelos</button></div></div>

function analysisChips() {
  const a = draft().analysis || [];
  if (!a.length) return '';
  return `<div class="field"><span>Lo que leyó de tu referencia</span><div class="row" style="gap:6px">${a.map((t) => `<span class="tag" style="font-size:12px;padding:5px 10px">${esc(t)}</span>`).join('')}</div></div>`;
}

function afterCrear() {
  const idea = $('#idea'), tpl = $('#tpl'), drop = $('#refdrop'), file = $('#reffile'), pt = $('#ptext');
  if (idea) idea.addEventListener('input', () => { draft().idea = idea.value; });
  if (tpl) tpl.addEventListener('change', () => { draft().template = tpl.value; });
  if (file) file.addEventListener('change', () => { if (file.files[0]) setRef(file.files[0]); });
  if (drop) {
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); const f = [...e.dataTransfer.files].find((x) => x.type.startsWith('image/')); if (f) setRef(f); else toast('Eso no es una imagen'); });
  }
  if (pt) pt.addEventListener('input', () => {
    const d = draft(), p = d.prompts[0];
    if (!p) return;
    if (d.tab === 'Base') p.base = pt.innerText; else p.versions[d.tab] = pt.innerText;
    saveSession();
  });
}
function setRef(blob) {
  const d = draft();
  if (d.refURL) URL.revokeObjectURL(d.refURL);
  d.refBlob = blob; d.refURL = URL.createObjectURL(blob); d.refName = blob.name || 'captura';
  render();
}

async function saveSession() {
  const d = draft();
  const { refURL, tab, refBlob, ...rest } = d;
  await DB.put('sessions', { ...rest });
}

async function generatePrompts() {
  const d = draft();
  const ideaEl = $('#idea'); if (ideaEl) d.idea = ideaEl.value;
  if (!d.idea.trim() && !d.refBlob) { toast('Escribe una idea o sube una referencia'); return; }
  d.clientId = S.ctx.clientId; d.campaignId = S.ctx.campaignId;
  let list = d.matrixOn ? combos(d.vars) : [{}];
  if (d.matrixOn && !list.length) { toast('Agrega al menos una variable a la matriz'); return; }
  if (list.length > 24) { toast('La matriz tiene más de 24 combinaciones'); return; }
  let template = d.template, recipeTxt = '';
  if (template.startsWith('receta:')) {
    const r = S.recipes.find((x) => x.id === template.slice(7));
    if (r) { recipeTxt = `Usa como base esta receta que ya funcionó en ${r.model}: «${r.prompt}».`; template = 'Receta: ' + r.name; }
  }
  const cli = clientById(d.clientId), camp = campaignById(d.campaignId);
  const lang = S.settings.promptLang === 'English' ? 'English' : 'Spanish';
  const models = enabledModels();
  const instr = `Eres un director de arte experto en paid ads y en escribir prompts para IAs de imagen.
Tarea: a partir de la idea${d.refBlob ? ' y la imagen de referencia adjunta' : ''}, escribe prompts de imagen listos para usar.
Idea de la diseñadora (puede venir en español o spanglish): «${d.idea || '(sin texto, guíate por la referencia)'}».
Plantilla: ${template}. ${recipeTxt}
${cli ? `Cliente: ${cli.name} (${cli.industry || ''}). Notas del cliente: ${cli.notes || 'ninguna'}.` : ''}${camp ? ` Campaña: ${camp.name}.` : ''}
Formato por defecto: ${d.format}.
${d.matrixOn ? `Genera exactamente ${list.length} prompts, uno por cada combinación de esta lista y en el mismo orden (si una combinación trae «Formato», usa ese formato en vez del por defecto):\n${list.map((c, i) => `${i + 1}. ${Object.entries(c).map(([k, v]) => `${k}: ${v}`).join(', ')}`).join('\n')}` : 'Genera 1 prompt.'}
Escribe todos los prompts en ${lang}. Para cada prompt da una versión base y una versión adaptada para cada una de estas IAs: ${models.join(', ')}.
Cómo adaptar: Gemini → frases descriptivas naturales, incluye el formato. ChatGPT → muy detallado y conversacional; si hay texto dentro de la imagen, ponlo entre comillas exactas. Higgsfield → lenguaje fotográfico/cinematográfico (cámara, lente, luz, movimiento), conciso. Pomelli → estilo brief de marketing: producto, mensaje de campaña, formato y uso en redes. Firefly → descripción concisa con tipo de contenido (foto), composición y estilo; sin nombres de artistas. Freepik → descriptivo y visual, con estilo fotográfico, iluminación, encuadre y paleta en frases cortas separadas por comas.
Para cada prompt sugiere qué IA usar entre (${models.join(', ')}) y explica por qué en una frase corta en español. Usa este historial de resultados de la diseñadora para decidir:
${modelStats(template)}
${d.refBlob ? 'También describe la referencia en hasta 6 etiquetas cortas en español (luz, composición, paleta, lente, mood, etc.).' : ''}
Responde solo JSON con esta forma:
{"analysis":["..."],"prompts":[{"base":"...","versions":{${models.map((m) => `"${m}":"..."`).join(',')}},"suggested":"${models[0] || 'Gemini'}","reason":"..."}]}`;
  const parts = [{ text: instr }];
  if (d.refBlob) parts.push({ inlineData: { mimeType: d.refBlob.type || 'image/png', data: await blobToBase64(d.refBlob) } });
  S.busy = true; S.error = null; render();
  try {
    const out = await geminiJSON(parts);
    const ps = Array.isArray(out.prompts) ? out.prompts : [];
    if (!ps.length) throw new GeminiError('parse', 'Gemini no devolvió prompts. Intenta de nuevo.');
    d.analysis = Array.isArray(out.analysis) ? out.analysis.slice(0, 6) : [];
    d.prompts = ps.slice(0, list.length).map((p, i) => ({
      id: uid(), n: i + 1, vars: list[i] || {}, base: String(p.base || ''),
      versions: Object.fromEntries(models.map((m) => [m, String((p.versions && p.versions[m]) || p.base || '')])),
      suggested: models.includes(p.suggested) ? p.suggested : models[0], reason: String(p.reason || ''),
      format: (list[i] && list[i].Formato) || d.format, selected: i < 8,
    }));
    d.tab = d.prompts[0].suggested || 'Base';
    d.templateName = template;
    if (d.refBlob && !d.refImageId) {
      const refImg = { id: uid(), blob: d.refBlob, kind: 'ref', model: 'Referencia', created: Date.now(), sessionId: d.id, campaignId: d.campaignId, clientId: d.clientId };
      await DB.put('images', refImg); d.refImageId = refImg.id;
    }
    await saveSession(); await reloadData();
    S.activePrompt = 0;
    if (d.prompts.length > 1) S.view = 'matriz';
  } catch (e) {
    S.error = e.message || 'Algo salió mal al generar los prompts.';
  } finally {
    S.busy = false; render();
  }
}

/* ============ Generar y comparar ============ */
function comparePrompts() {
  const d = S.draft;
  if (!d || !d.prompts.length) return [];
  return d.prompts.length > 1 ? d.prompts.filter((p) => p.selected) : d.prompts;
}
function resultFor(promptId, model) {
  return S.images.find((i) => i.kind === 'result' && i.promptId === promptId && i.model === model);
}
function ratioCSS(f) { return (f || '4:5').replace(':', ' / '); }

function viewComparar() {

}
function compareCard(p, m) {
  const r = resultFor(p.id, m);
  const b = BRAND[m];
  const direct = m === 'Gemini' && S.settings.imagesDirect;
  const target = S.pasteTarget && S.pasteTarget.promptId === p.id && S.pasteTarget.model === m;
  const sug = p.suggested === m ? ' · sugerido' : '';
  let status = '<span class="status">Sin empezar</span>', body;
  if (r) {
    status = r.mark === 'ok' ? '<span class="status ok">Funcionó</span>' : r.mark === 'bad' ? '<span class="status bad">No funcionó</span>' : `<span class="status">${r.source === 'direct' ? 'Generado' : 'Subido'}</span>`;
    body = `<img class="img4x5" style="aspect-ratio:${ratioCSS(p.format)};object-fit:contain;background:${b.bg}" src="${imgURL(r)}" alt="Resultado de ${m}">
      <div class="row" style="flex-wrap:nowrap">
        <button class="btn block" aria-pressed="${r.mark === 'ok'}" data-act="mark" data-id="${r.id}" data-v="ok" style="${r.mark === 'ok' ? 'background:var(--mint-tint);border-color:var(--mint);color:var(--mint-dark);font-weight:600' : ''}">${IC(I.check, 16)}Funcionó</button>
        <button class="btn block" aria-pressed="${r.mark === 'bad'}" data-act="mark" data-id="${r.id}" data-v="bad" style="${r.mark === 'bad' ? 'background:var(--red-tint);border-color:#B4392C;color:var(--red);font-weight:600' : ''}">${IC(I.x, 16)}No</button></div>
      <label class="field"><span style="font-size:12px">Nota</span><input class="input" style="height:40px;font-size:13px" data-note="${r.id}" value="${esc(r.note || '')}" placeholder="¿Qué funcionó o qué no?"></label>
      <div class="row">${r.mark === 'ok' ? `<button class="btn sm primary" data-act="recipe" data-id="${r.id}">Guardar como receta</button>` : ''}
        <button class="btn sm" data-act="edit-img" data-id="${r.id}">Editar</button>
        <button class="btn sm" data-act="dl" data-id="${r.id}">${IC(I.dl, 14)}Descargar</button>
        <button class="btn sm ghost" data-act="replace" data-p="${p.id}" data-m="${m}">Reemplazar</button></div>`;
  } else if (direct) {
    body = `<div class="drop" style="aspect-ratio:${ratioCSS(p.format)};min-height:0">${IC(I.crear, 24)}<span>Gemini genera la imagen directo en la app.</span>
      <button class="btn primary" data-act="gen-direct" data-p="${p.id}" ${S.busy ? 'disabled' : ''}>${S.busy === p.id ? '<span class="spin"></span> Generando…' : 'Generar con Gemini'}</button>
      <span class="small">Se cobra en tu cuenta de Google</span></div>
      <button class="btn sm ghost" data-act="bridge" data-p="${p.id}" data-m="${m}">O usar la app de Gemini como puente</button>`;
  } else {
    body = `<button class="btn primary" data-act="bridge" data-p="${p.id}" data-m="${m}">${IC(I.ext, 16)}Copiar prompt y abrir ${m}</button>
      <button class="drop ${target ? 'hot' : ''}" data-act="paste-here" data-p="${p.id}" data-m="${m}" style="aspect-ratio:${ratioCSS(p.format)};min-height:0;max-height:420px">
        ${IC(I.upload, 26)}<b style="font-weight:600">${target ? 'Lista para recibir la imagen' : 'Trae el resultado'}</b><span class="small">Pega con Ctrl+V, arrastra o toca aquí para elegir el archivo</span></button>
      <button class="btn sm" data-act="clip-paste" data-p="${p.id}" data-m="${m}">${IC(I.copy, 14)}Pegar imagen copiada</button>`;
  }
  return `<article class="card tight" style="${p.suggested === m ? 'border:2px solid var(--lav)' : ''}" aria-label="Resultado de ${m}" data-dropcard data-p="${p.id}" data-m="${m}">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div style="display:flex;flex-direction:column;gap:4px">${aiChip(m)}<span class="small muted">${direct ? 'Conexión directa' : 'Puente'}${sug}</span></div>${status}</div>
    ${body}</article>`;
}

async function saveResult(blob, promptId, model, source = 'bridge') {
  if (!blob || !blob.type.startsWith('image/')) { toast('Ese archivo no es una imagen. Usa PNG, JPG o WEBP.'); return; }
  const d = S.draft;
  const p = d.prompts.find((x) => x.id === promptId);
  const old = resultFor(promptId, model);
  if (old) await DB.del('images', old.id);
  await DB.put('images', {
    id: uid(), blob, kind: 'result', model, promptId, sessionId: d.id, campaignId: d.campaignId, clientId: d.clientId, conceptId: d.conceptId || null,
    prompt: p ? (p.versions[model] || p.base) : '', format: p ? p.format : d.format, template: d.templateName || d.template,
    vars: p ? p.vars : {}, mark: null, note: '', created: Date.now(), source,
  });
  S.pasteTarget = null;
  await reloadData(); render(); toast(`Imagen guardada en ${model}`);
}
async function genDirect(promptId) {
  const d = S.draft, p = d.prompts.find((x) => x.id === promptId);
  S.busy = promptId; S.error = null; render();
  try {
    const blob = await geminiImage(p.versions.Gemini || p.base, p.format);
    S.busy = false;
    await saveResult(blob, promptId, 'Gemini', 'direct');
  } catch (e) {
    S.error = e.kind === 'limit' ? 'Llegaste al límite de Gemini por ahora. Puedes seguir con un puente mientras tanto.' : e.message;
    S.busy = false; render();
  }
}
async function openBridge(promptId, model) {
  const p = S.draft.prompts.find((x) => x.id === promptId);
  const text = p.versions[model] || p.base;
  try { await navigator.clipboard.writeText(text); toast(`Prompt copiado. Pégalo en ${model} con Ctrl+V`); } catch (e) { toast('No se pudo copiar automáticamente; cópialo desde Crear'); }
  const url = (S.settings.bridges[model] || {}).url;
  if (url) window.open(url, '_blank', 'noopener');
  S.pasteTarget = { promptId, model };
  render();
}
function recipeModal(imgId) {
  const img = S.images.find((i) => i.id === imgId);

  modal({

    body: `<label class="field"><span>Nombre de la receta</span><input class="input" name="name" value="${esc(def)}"></label>
      <div class="field"><span>Prompt (${esc(img.model)})</span><div class="prompt" style="min-height:0">${esc(img.prompt)}</div></div>
      <label class="row small"><input type="checkbox" name="client" checked style="accent-color:var(--purple)"> Solo para este cliente</label>`,
    onOk: async (f) => {
      await DB.put('recipes', { id: uid(), name: f.name || def, model: img.model, prompt: img.prompt, template: img.template, format: img.format, clientId: f.client ? img.clientId : null, uses: 0, created: Date.now(), imageId: img.id });
      await reloadData(); render(); toast('Receta guardada. Aparece en Plantillas al crear.');
    },
  });
}
function downloadImage(img, name) {
  const a = document.createElement('a');

/* --- herramientas locales --- */
function canvasToBlob(c, type = 'image/png', q) { return new Promise((r) => c.toBlob(r, type, q)); }
async function bitmap(blob) { return await createImageBitmap(blob); }
function ratioNum(r) { const [a, b] = r.split(':').map(Number); return a / b; }

async function removeBackground(blob) {
  let mod;
  try { mod = await import('https://esm.sh/@imgly/background-removal@1'); } catch (e) {
    throw new Error('No se pudo cargar la herramienta de recorte. Revisa tu conexión a internet.');
  }
  const fn = mod.removeBackground || (mod.default && mod.default.removeBackground) || mod.default;
  return await fn(blob);
}
async function compositeOnColor(cutout, color, shadow) {
  const bm = await bitmap(cutout);
  const pad = Math.round(Math.max(bm.width, bm.height) * 0.04);
  const c = document.createElement('canvas');
  c.width = bm.width; c.height = bm.height;
  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  if (shadow) {
    x.save();
    x.shadowColor = color === '#FFFFFF' ? 'rgba(0,0,0,0.18)' : 'rgba(255,255,255,0.10)';
    x.shadowBlur = pad; x.shadowOffsetY = Math.round(pad / 2);
    x.drawImage(bm, 0, 0); x.restore();
  }
  x.drawImage(bm, 0, 0);
  return canvasToBlob(c, 'image/png');
}
async function extendBlur(blob, ratio) {
  const bm = await bitmap(blob);
  const target = ratioNum(ratio), cur = bm.width / bm.height;
  let W = bm.width, H = bm.height;
  if (target > cur) W = Math.round(bm.height * target); else H = Math.round(bm.width / target);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const cover = Math.max(W / bm.width, H / bm.height);
  x.filter = `blur(${Math.round(Math.max(W, H) / 30)}px) saturate(1.05)`;
  const bw = bm.width * cover * 1.1, bh = bm.height * cover * 1.1;
  x.drawImage(bm, (W - bw) / 2, (H - bh) / 2, bw, bh);
  x.filter = 'none';
  x.fillStyle = 'rgba(255,255,255,0.06)'; x.fillRect(0, 0, W, H);
  x.drawImage(bm, Math.round((W - bm.width) / 2), Math.round((H - bm.height) / 2));
  return canvasToBlob(c, 'image/png');
}
async function upscale(blob, factor) {
  const bm = await bitmap(blob);
  const maxSide = 6000;
  const f = Math.min(factor, maxSide / Math.max(bm.width, bm.height));
  let src = document.createElement('canvas'); src.width = bm.width; src.height = bm.height;
  src.getContext('2d').drawImage(bm, 0, 0);
  let cur = 1;
  while (cur < f) {
    const step = Math.min(2, f / cur);
    const n = document.createElement('canvas');
    n.width = Math.round(src.width * step); n.height = Math.round(src.height * step);
    const nx = n.getContext('2d'); nx.imageSmoothingEnabled = true; nx.imageSmoothingQuality = 'high';
    nx.drawImage(src, 0, 0, n.width, n.height);
    src = n; cur *= step;
  }
  sharpen(src, 0.45);
  return canvasToBlob(src, 'image/png');
}
function sharpen(canvas, amount) {
  const x = canvas.getContext('2d');
  const { width: w, height: h } = canvas;
  const img = x.getImageData(0, 0, w, h), d = img.data, o = new Uint8ClampedArray(d);
  const c = 1 + 4 * amount, s = -amount;
  for (let y = 1; y < h - 1; y++) {
    for (let xx = 1; xx < w - 1; xx++) {
      const i = (y * w + xx) * 4;
      for (let k = 0; k < 3; k++) {
        const v = c * o[i + k] + s * (o[i - 4 + k] + o[i + 4 + k] + o[i - w * 4 + k] + o[i + w * 4 + k]);
        d[i + k] = v;
      }
    }
  }
  x.putImageData(img, 0, 0);
}

async function runEdit(step) {
  const base = S.images.find((i) => i.id === S.edit.previewId) || S.images.find((i) => i.id === S.editImageId);
  if (!base) return;
  const E = S.edit;
  S.busy = 'edit'; S.editStep = step; S.error = null; render();
  try {
    let out, label, format = base.format;
    if (step === 'bg') {
      const color = E.bg === 'white' ? '#FFFFFF' : '#141414';
      if (E.bgMode === 'gemini' && S.settings.imagesDirect) {
        out = await geminiImage(`Replace the background of this image with a solid pure ${E.bg === 'white' ? 'white (#FFFFFF)' : 'black (#141414)'} studio background. Keep the product and subject exactly as they are, same position, lighting and details.${E.shadow ? ' Add a soft, natural contact shadow under the product.' : ''}`, base.format, base.blob);
      } else {
        out = await compositeOnColor(await removeBackground(base.blob), color, E.shadow);
      }
      label = E.bg === 'white' ? 'Fondo blanco' : 'Fondo negro';
    } else if (step === 'ext') {
      if (E.extMode === 'gemini' && S.settings.imagesDirect) {
        out = await geminiImage(`Extend this image to a ${E.ratio} aspect ratio by outpainting the surroundings naturally. Keep the original content, product and lighting unchanged and centered.`, E.ratio, base.blob);
      } else {
        out = await extendBlur(base.blob, E.ratio);
      }
      label = 'Ampliada ' + E.ratio; format = E.ratio;
    } else {
      out = await upscale(base.blob, E.scale);
      label = 'Calidad ' + E.scale + '×';
    }
    const n = { ...base, id: uid(), blob: out, kind: 'edit', model: 'Edición', parentId: base.id, rootId: base.rootId || base.id, editLabel: label, format, mark: null, note: '', created: Date.now(), source: 'edit' };
    await DB.put('images', n);
    await reloadData();
    S.edit.previewId = n.id;
    toast(label + ': versión guardada');
  } catch (e) {
    S.error = e.message || 'No se pudo aplicar la edición.';
  } finally {
    S.busy = false; S.editStep = null; render();
  }
}

async function backup() {
  const data = {};
  for (const st of ['clients', 'campaigns', 'sessions', 'recipes', 'concepts', 'frameworks', 'brands', 'notes']) data[st] = await DB.all(st);
  data.refs = await Promise.all((await DB.all('refs')).map(async (r) => ({ ...r, blob: undefined, b64: r.blob ? await blobToBase64(r.blob) : null, mime: r.blob ? r.blob.type : null })));
  const imgs = await DB.all('images');
  data.images = await Promise.all(imgs.map(async (i) => ({ ...i, blob: undefined, b64: await blobToBase64(i.blob), mime: i.blob.type })));
  data.settings = { ...S.settings, apiKey: '' };
  data.version = 1;
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `whoops-ai-respaldo-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Respaldo descargado (sin tu clave de API)');
}
async function restore(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data.version) throw new Error('formato');
    for (const st of ['clients', 'campaigns', 'sessions', 'recipes', 'concepts', 'frameworks', 'brands', 'notes']) for (const o of data[st] || []) await DB.put(st, o);
    for (const r of data.refs || []) { const { b64, mime, ...rest } = r; await DB.put('refs', { ...rest, blob: b64 ? base64ToBlob(b64, mime) : null }); }
    for (const i of data.images || []) { const { b64, mime, ...rest } = i; await DB.put('images', { ...rest, blob: base64ToBlob(b64, mime) }); }
    await reloadData(); render(); toast('Respaldo restaurado');
  } catch (e) { toast('Ese archivo no es un respaldo de Whoops AI!'); }
}

async function updateImage(id, patch) {
  const img = S.images.find((i) => i.id === id);
  if (!img) return;
  Object.assign(img, patch);
  await DB.put('images', img);
}
function pickFile(input, cb) {
  const el = $(input);
  if (!el) return;
  el.onchange = () => { if (el.files[0]) cb(el.files[0]); el.value = ''; };
  el.click();
}
async function readClipboardImage() {
  if (!navigator.clipboard || !navigator.clipboard.read) { toast('Tu navegador no permite leer el portapapeles. Toca la zona punteada para elegir el archivo.', 4500); return null; }
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) {
      const type = it.types.find((x) => x.startsWith('image/'));
      if (type) return await it.getType(type);
    }
    toast('No hay una imagen copiada. Mantén presionada la imagen en la otra app y elige «Copiar».', 4500);
  } catch (e) { toast('No se pudo leer el portapapeles. Permite el acceso o elige el archivo.', 4500); }
  return null;
}
function selectedCompareIndex(promptId) { return comparePrompts().findIndex((p) => p.id === promptId); }

document.addEventListener('click', async (e) => {

  const a = t.dataset.act, d = S.draft;
  switch (a) {

    case 'matrix': draft().matrixOn = !draft().matrixOn; render(); break;

    case 'var-add': {

    }

    case 'ref-del': { const dd = draft(); dd.refBlob = null; dd.refImageId = null; render(); break; }
    case 'gen-prompts': generatePrompts(); break;
    case 'ptab': draft().tab = t.dataset.v; render(); break;
    case 'copy-prompt': {
      const txt = ($('#ptext') || {}).innerText || '';
      try { await navigator.clipboard.writeText(txt); toast('Prompt copiado'); } catch (err) { toast('No se pudo copiar'); }
      break;
    }
    case 'claude-polish': {
      const dd = draft(), pp = dd.prompts[0];
      const txt = ($('#ptext') || {}).innerText || '';
      const target = dd.tab === 'Base' ? 'cualquier IA de imagen' : dd.tab;
      const ask = `Eres director de arte experto en paid ads. Mejora este prompt de imagen para ${target}. Mantén la idea, hazlo más preciso en luz, composición, encuadre y estilo, y devuélveme solo el prompt final en ${S.settings.promptLang === 'English' ? 'inglés' : 'español'}, sin explicaciones.\n\nIdea original: ${dd.idea || '(desde referencia)'}\nPrompt actual:\n${txt}`;
      try { await navigator.clipboard.writeText(ask); toast('Pedido copiado. Pégalo en Claude y trae el prompt pulido a este recuadro.', 4500); } catch (err) { toast('No se pudo copiar'); }
      window.open(S.settings.claudeUrl || 'https://claude.ai/new', '_blank', 'noopener');
      break;
    }
    case 'to-compare': S.activePrompt = 0; S.pasteTarget = null; go('comparar'); break;
    case 'new-draft': S.draft = newDraft(); S.error = null; render(); break;
    /* Matriz */
    case 'mopen': { const p = d.prompts[+t.dataset.i]; p.selected = true; await saveSession(); S.activePrompt = selectedCompareIndex(p.id); go('comparar'); break; }
    case 'mcopy': {
      const txt = d.prompts.filter((p) => p.selected).map((p) => `${p.n}. ${p.base}`).join('\n\n');
      try { await navigator.clipboard.writeText(txt); toast('Prompts copiados'); } catch (err) { toast('No se pudo copiar'); }
      break;
    }
    case 'mcompare': S.activePrompt = 0; go('comparar'); break;
    /* Comparar */
    case 'pprev': S.activePrompt = (S.activePrompt - 1 + comparePrompts().length) % comparePrompts().length; S.pasteTarget = null; render(); break;
    case 'pnext': S.activePrompt = (S.activePrompt + 1) % comparePrompts().length; S.pasteTarget = null; render(); break;
    case 'bridge': openBridge(t.dataset.p, t.dataset.m); break;
    case 'paste-here': {
      const pid = t.dataset.p, m = t.dataset.m;
      S.pasteTarget = { promptId: pid, model: m };
      pickFile('#anyfile', (f) => saveResult(f, pid, m));
      break;
    }
    case 'clip-paste': case 'clip-ref': {
      const blob = await readClipboardImage();
      if (!blob) break;
      if (a === 'clip-ref') setRef(blob); else saveResult(blob, t.dataset.p, t.dataset.m);
      break;
    }
    case 'nav-open': document.querySelector('.app').classList.add('nav-open'); break;
    case 'nav-close': closeNav(); break;
    case 'replace': { const p = t.dataset.p, m = t.dataset.m; pickFile('#anyfile', (f) => saveResult(f, p, m)); break; }
    case 'gen-direct': genDirect(t.dataset.p); break;
    case 'mark': {
      const img = S.images.find((i) => i.id === t.dataset.id);
      await updateImage(t.dataset.id, { mark: img.mark === t.dataset.v ? null : t.dataset.v }); render(); break;

    case 'recipe': recipeModal(t.dataset.id); break;
    case 'dl': downloadImage(S.images.find((i) => i.id === t.dataset.id)); break;

    /* Biblioteca */
    case 'libtab': S.libTab = t.dataset.v; render(); break;
    case 'libdl': {
      const ids = [...S.libSel];
      for (const [n, id] of ids.entries()) { const img = S.images.find((i) => i.id === id); if (img) setTimeout(() => downloadImage(img), n * 350); }
      break;

    case 'libdel': {

      modal({ title: 'Eliminar imágenes', okLabel: `Eliminar ${ids.length}`, body: `<p style="margin:0">Se eliminarán ${ids.length} ${ids.length === 1 ? 'imagen' : 'imágenes'} de la biblioteca. Esto no se puede deshacer.</p>`,
        onOk: async () => { for (const id of ids) await DB.del('images', id); S.libSel.clear(); await reloadData(); render(); toast('Imágenes eliminadas'); } });
      break;
    }
    case 'as-ref': {
      const img = S.images.find((i) => i.id === t.dataset.id);
      S.draft = newDraft(); setRef(img.blob); go('crear'); break;
    }
    case 'recipe-use': {
      const r = S.recipes.find((x) => x.id === t.dataset.id);
      r.uses = (r.uses || 0) + 1; await DB.put('recipes', r);
      S.draft = newDraft(); S.draft.template = 'receta:' + r.id; S.draft.format = r.format || S.draft.format;
      await reloadData(); go('crear'); break;
    }
    case 'recipe-del': await DB.del('recipes', t.dataset.id); await reloadData(); render(); toast('Receta eliminada'); break;
    case 'session-open': openSession(t.dataset.id); break;
    /* Edición */
    case 'edit-close': S.editImageId = null; S.edit.previewId = null; render(); break;
    case 'edit-upload': pickFile('#editfile', async (f) => {
      if (!f.type.startsWith('image/')) { toast('Eso no es una imagen'); return; }
      const img = { id: uid(), blob: f, kind: 'result', model: 'Edición', editLabel: 'Original', created: Date.now(), clientId: S.ctx.clientId, campaignId: S.ctx.campaignId, format: '', source: 'upload', mark: null, note: '' };
      await DB.put('images', img); await reloadData(); S.editImageId = img.id; S.edit.previewId = img.id; render();
    }); break;
    case 'eset': { const v = t.dataset.v; S.edit[t.dataset.k] = t.dataset.k === 'scale' ? +v : v; render(); break; }
    case 'eprev': S.edit.previewId = t.dataset.id; render(); break;
    case 'do-bg': runEdit('bg'); break;
    case 'do-ext': runEdit('ext'); break;
    case 'do-up': runEdit('up'); break;
    /* Ajustes */
    case 'key-save': S.settings.apiKey = ($('#apikey').value || '').trim(); saveSettings(); render(); toast('Clave guardada en este navegador'); break;
    case 'key-test': S.settings.apiKey = ($('#apikey').value || '').trim(); saveSettings(); testKey(); break;
    case 'direct': S.settings.imagesDirect = !S.settings.imagesDirect; saveSettings(); render(); break;
    case 'bridge-on': { const b = S.settings.bridges[t.dataset.m]; b.on = !b.on; if (!enabledModels().length) { b.on = true; toast('Deja al menos una IA activa'); } saveSettings(); render(); break; }
    case 'backup': backup(); break;
    case 'restore': pickFile('#restorefile', restore); break;
    case 'wipe': modal({ title: 'Borrar todo', okLabel: 'Borrar todo', body: '<p style="margin:0">Se borrarán clientes, campañas, imágenes, recetas e historial de este navegador. Tu clave y tus ajustes se mantienen. Te recomendamos descargar un respaldo antes.</p>',
      onOk: async () => { for (const st of ['clients', 'campaigns', 'sessions', 'images', 'recipes', 'refs', 'concepts', 'frameworks', 'brands', 'notes']) await DB.clear(st); S.draft = null; S.ctx = { clientId: null, campaignId: null }; await reloadData(); render(); toast('Datos borrados'); } }); break;
    default: if (ACTIONS[a]) await ACTIONS[a](t, e); break;
  }
});

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset.act === 'msel') { S.draft.prompts[+t.dataset.i].selected = t.checked; await saveSession(); render(); }
  else if (t.dataset.act === 'mall') { S.draft.prompts.forEach((p) => { p.selected = t.checked; }); await saveSession(); render(); }
  else if (t.dataset.act === 'libsel') { if (t.checked) S.libSel.add(t.dataset.id); else S.libSel.delete(t.dataset.id); render(); }
  else if (t.dataset.act === 'eshadow') { S.edit.shadow = t.checked; }
  else if (t.dataset.filter) { S.libFilter[t.dataset.filter] = t.value; render(); }
  else if (t.dataset.note) { await updateImage(t.dataset.note, { note: t.value }); toast('Nota guardada'); }
  else if (t.dataset.set) { S.settings[t.dataset.set] = t.value; saveSettings(); toast('Guardado'); }
  else if (t.dataset.ch && CHANGES[t.dataset.ch]) { await CHANGES[t.dataset.ch](t, e); }
  else if (t.dataset.bridgeUrl) { S.settings.bridges[t.dataset.bridgeUrl].url = t.value.trim(); saveSettings(); toast('Link guardado'); }
});

/* Pegar imágenes con Ctrl+V */
document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find((i) => i.type.startsWith('image/'));
  if (!item) {
    if (S.view === 'comparar' && S.pasteTarget && !e.target.closest('input,textarea,[contenteditable="true"]')) toast('Lo que pegaste no es una imagen. Copia la imagen (clic derecho → Copiar imagen) y vuelve a pegar.', 4000);
    return;
  }
  const blob = item.getAsFile();
  if (S.view === 'crear') { e.preventDefault(); setRef(blob); }
  else if (S.view === 'research') { e.preventDefault(); setCapture(blob); }
  else if (S.view === 'comparar') {
    e.preventDefault();
    let tgt = S.pasteTarget;
    if (!tgt) {
      const p = comparePrompts()[S.activePrompt];
      const free = p ? enabledModels().filter((m) => !resultFor(p.id, m) && !(m === 'Gemini' && S.settings.imagesDirect)) : [];
      if (free.length === 1) tgt = { promptId: p.id, model: free[0] };
    }
    if (tgt) saveResult(blob, tgt.promptId, tgt.model);
    else toast('Primero haz clic en «Trae el resultado» de la tarjeta donde va la imagen', 4000);
  }
});

function viewResearch() {
  const f = S.rf;
  let refs = refsInScope();
  const pending = refs.filter((r) => (r.suggested || []).length || r.status !== 'analyzed').length;

  if (f.angle !== 'all') refs = refs.filter((r) => refAngles(r).includes(f.angle));
  if (f.format !== 'all') refs = refs.filter((r) => refFormat(r) === f.format);
  const formats = [...new Set(S.refs.map(refFormat).filter(Boolean))];
  const sel = (name, opts, val) => `<select class="input" style="height:40px;width:auto" data-ch="rf" data-k="${name}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${val === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const c = S.cap;
  const capture = `<section class="card" aria-labelledby="h-cap"><h2 id="h-cap" style="font-size:15px">Captura rápida</h2>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px" class="capgrid">

async function analyzeRef(r) {
  const parts = [{ text: `Eres estratega creativo y director de arte experto en paid ads. Analiza esta referencia${r.source ? ' de ' + r.source : ''}${r.url ? ' (link: ' + r.url + ')' : ''}.
Responde en español, frases claras y concretas (1–2 frases por punto), explicando por qué funciona.
Etiquetas: usa type "angle" con uno o dos de: ${ANGLES.join(', ')}; type "hook" con el tipo de hook en 1–3 palabras (ej. POV, Pregunta directa, Macro textura, Contador, Review card); type "industry" con la industria en 1–2 palabras; type "format" con la proporción aproximada (1:1, 4:5, 9:16, 16:9, 4:3) o "Video" si es un frame de video.
Responde solo JSON: {"brand":"marca visible o vacío","analysis":{${ANALYSIS_KEYS.map((k) => `"${k}":"..."`).join(',')}},"tags":[{"type":"angle","label":"..."}]}` }];
  parts.push({ inlineData: { mimeType: r.blob.type || 'image/png', data: await blobToBase64(r.blob) } });
  const out = await geminiJSON(parts);
  r.analysis = {};
  for (const k of ANALYSIS_KEYS) r.analysis[k] = String((out.analysis && out.analysis[k]) || '');
  if (!r.brand && out.brand) r.brand = String(out.brand).slice(0, 60);
  r.suggested = (Array.isArray(out.tags) ? out.tags : []).filter((t) => t && t.label && TAGTYPE[t.type]).map((t) => ({ t: t.type, l: String(t.label).slice(0, 40) }));
  r.status = 'analyzed';
}
async function saveCapture() {
  const c = S.cap;
  c.url = ($('#capurl') || {}).value || c.url; c.source = ($('#capsrc') || {}).value || c.source; c.brand = ($('#capbrand') || {}).value || c.brand;
  if (!c.blob && !c.url.trim()) { toast('Pega una captura o un link'); return; }
  const r = { id: uid(), blob: c.blob, url: c.url.trim(), source: c.source, brand: c.brand.trim(), clientId: S.ctx.clientId, campaignId: S.ctx.campaignId, created: Date.now(), status: c.blob ? 'pending' : 'link', tags: [], suggested: [], analysis: null, conceptIds: [] };
  await DB.put('refs', r);
  S.cap = { blob: null, url: '', source: c.source, brand: '' };
  if (S.capURL) { URL.revokeObjectURL(S.capURL); S.capURL = null; }
  S.error = null;
  if (r.blob && S.settings.apiKey) {
    S.busy = 'cap'; render();
    try { await analyzeRef(r); await DB.put('refs', r); toast('Referencia guardada y analizada'); } catch (e) { r.status = 'error'; await DB.put('refs', r); S.error = e.message; }
    S.busy = false;
  } else toast(r.blob ? 'Guardada. Conecta Gemini en Ajustes para analizarla.' : 'Link guardado');
  await reloadData(); render();
}

async function saveConcept(c, rerender = true) { await DB.put('concepts', c); await reloadData(); if (rerender) render(); }
CHANGES.cf = async (t) => { const c = conceptById(S.conceptId); c.fields[t.dataset.k] = t.value; c.versions[c.versions.length - 1].fields = structuredClone(c.fields); await saveConcept(c, t.tagName === 'SELECT'); };
CHANGES.cname = async (t) => { const c = conceptById(S.conceptId); c.name = t.value.trim() || c.name; await saveConcept(c); };
CHANGES.cmetrics = async (t) => { const c = conceptById(S.conceptId); c.metrics = t.value; await saveConcept(c, false); toast('Guardado'); };
CHANGES.cpal = async (t) => { const c = conceptById(S.conceptId); const p = (c.fields.palette || []).slice(); while (p.length < 4) p.push('#FFFFFF'); p[+t.dataset.i] = t.value.toUpperCase(); c.fields.palette = p; c.versions[c.versions.length - 1].fields = structuredClone(c.fields); await saveConcept(c); };
CHANGES.cstatus = async (t) => { const c = conceptById(S.conceptId); c.status = t.value; await saveConcept(c); toast('Estado actualizado'); };
CHANGES.cver = async (t) => {
  const c = conceptById(S.conceptId), i = +t.value;
  if (i === c.versions.length - 1) return;
  const v = c.versions[i];
  c.fields = structuredClone(v.fields);
  c.versions.push({ n: c.versions.length + 1, at: Date.now(), fields: structuredClone(v.fields), note: `Restaurada de v${v.n}` });
  await saveConcept(c); toast(`Restauraste la v${v.n} como versión nueva`);
};
ACTIONS['cfw-clear'] = async () => { const c = conceptById(S.conceptId); c.frameworkId = null; await saveConcept(c); };
ACTIONS['cimgs-lib'] = () => { S.libTab = 'images'; S.libFilter.campaign = 'all'; go('biblioteca'); };
ACTIONS['cchat-quick'] = (t) => conceptChat(t.dataset.v);
ACTIONS['cref-add'] = () => {
  const c = conceptById(S.conceptId);
  const refs = S.refs.filter((r) => !c.clientId || !r.clientId || r.clientId === c.clientId);
  if (!refs.length) { toast('Tu swipe file está vacío. Agrega referencias en Research.'); return; }
  modal({ title: 'Vincular referencias', okLabel: 'Guardar',
    body: `<div class="grid3" style="gap:10px;max-height:420px;overflow:auto">${refs.map((r) => `<label style="display:flex;flex-direction:column;gap:4px;font-size:12px;cursor:pointer"><span style="position:relative;display:block;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--lav-tint)">${r.blob ? `<img src="${refURL(r)}" alt="" style="width:100%;height:100%;object-fit:cover">` : ''}<input type="checkbox" name="r_${r.id}" ${(c.refIds || []).includes(r.id) ? 'checked' : ''} style="position:absolute;top:6px;left:6px;width:18px;height:18px;accent-color:var(--purple)"></span>${esc(r.brand || r.source)}</label>`).join('')}</div>`,
    onOk: async (f) => {
      const ids = Object.keys(f).filter((k) => k.startsWith('r_')).map((k) => k.slice(2));
      c.refIds = ids;
      for (const r of S.refs) {
        const has = (r.conceptIds || []).includes(c.id), want = ids.includes(r.id);
        if (has !== want) { r.conceptIds = want ? [...(r.conceptIds || []), c.id] : r.conceptIds.filter((x) => x !== c.id); await DB.put('refs', r); }
      }
      await saveConcept(c);
    } });
};
ACTIONS['concept-down'] = () => {
  const c = conceptById(S.conceptId), F = c.fields;
  S.ctx = { clientId: c.clientId || null, campaignId: c.campaignId || null };
  const d = newDraft();
  d.conceptId = c.id;
  d.idea = [F.visual, F.headline ? `Headline: «${F.headline}»` : '', F.message ? `Mensaje: ${F.message}` : '', F.palette && F.palette.length ? `Paleta: ${F.palette.join(', ')}` : ''].filter(Boolean).join('. ') || c.name;
  if (F.angle) { d.matrixOn = true; d.vars['Ángulo'] = [F.angle]; }
  const r = S.refs.find((x) => (c.refIds || []).includes(x.id) && x.blob);
  S.draft = d; go('crear');
  if (r) setRef(r.blob);
  toast('Concepto cargado en Crear. Ajusta la matriz y genera los prompts.');
};

async function conceptChat(text) {
  const c = conceptById(S.conceptId);
  if (!S.settings.apiKey) { toast('Conecta Gemini en Ajustes'); return; }
  c.chat = [...(c.chat || []), { role: 'user', text, at: Date.now() }];
  S.busy = 'chat'; S.error = null; await saveConcept(c);
  const refs = S.refs.filter((r) => (c.refIds || []).includes(r.id) && r.analysis);
  const fw = S.frameworks.find((x) => x.id === c.frameworkId);
  const camp = campaignById(c.campaignId), cli = clientById(c.clientId);
  const history = c.chat.slice(-10).map((m) => `${m.role === 'user' ? 'Diseñadora' : 'IA'}: ${m.text}`).join('\n');
  const prompt = `Eres estratega creativo senior de paid ads trabajando con una diseñadora. Ayúdala a iterar este concepto de campaña. Responde en español (ella escribe en español o spanglish; los copys pueden ir en inglés si ya lo están).
${cli ? `Cliente: ${cli.name} (${cli.industry || ''}). Notas: ${cli.notes || '—'}.` : ''} ${camp ? `Campaña: ${camp.name} (${camp.objective || ''}).` : ''}
Concepto «${c.name}». Ficha actual (JSON): ${JSON.stringify(c.fields)}
${fw ? `Framework elegido: ${fw.name} — fórmula: ${fw.formula}.` : ''}
${refs.length ? `Referencias vinculadas:\n${refs.map((r) => `- ${r.brand || r.source}: hook ${r.analysis.Hook}; ángulo ${r.analysis['Ángulo de venta']}`).join('\n')}` : ''}
Conversación reciente:
${history}
Si el último mensaje pide un cambio en la ficha, devuelve en "fields" SOLO los campos que cambian (claves posibles: insight, angle, message, headline, body, cta, visual). Si solo pide ideas u opiniones, deja "fields" en null y responde con las ideas.
Responde solo JSON: {"reply":"respuesta breve y concreta","fields":null}`;
  try {
    const out = await geminiJSON([{ text: prompt }]);
    const reply = String(out.reply || 'Listo.');
    const upd = out.fields && typeof out.fields === 'object' ? out.fields : null;
    const msg = { role: 'ai', text: reply, at: Date.now() };
    if (upd && Object.keys(upd).length) {
      for (const [k, v] of Object.entries(upd)) if (k in c.fields || CFIELDS.some(([kk]) => kk === k)) c.fields[k] = String(v);
      c.versions.push({ n: c.versions.length + 1, at: Date.now(), fields: structuredClone(c.fields), note: text.slice(0, 40) });
      msg.version = c.versions.length;
    }
    c.chat.push(msg);
  } catch (e) { S.error = e.message; }
  S.busy = false; await saveConcept(c);
}

/* ============ Parte 2 · Mapa de campaña ============ */
function viewMapa() {
  const camp = campaignById(S.ctx.campaignId);
  if (!camp) {
    return topBar('Mapa de campaña') + `<section class="card"><div class="empty">${IC(VIEWS.mapa.icon, 28)}<span>El mapa muestra todo el proceso de una campaña.<br>Elige una campaña en el menú de la izquierda (dentro de un cliente).</span>
      ${S.clients.length ? '' : '<button class="btn primary" data-new-client>Crear un cliente</button>'}</div></section>`;
  }
  const refs = S.refs.filter((r) => r.campaignId === camp.id || (r.clientId === camp.clientId && !r.campaignId));
  const concepts = S.concepts.filter((c) => c.campaignId === camp.id).sort((a, b) => ({ elegido: 0, explorando: 1, descartado: 2 }[a.status || 'explorando'] - { elegido: 0, explorando: 1, descartado: 2 }[b.status || 'explorando']));
  const W = 260, GAP = 136, COLS = [24, 24 + W + GAP, 24 + 2 * (W + GAP), 24 + 3 * (W + GAP), 24 + 4 * (W + GAP)];
  const ROWH = 230, TOP = 80;
  const n = Math.max(concepts.length, 1);
  const H = TOP + n * ROWH + 40;
  const rowY = (i) => TOP + i * ROWH + ROWH / 2 - 10;
  const lines = [], dots = [], cards = [], pills = [];
  const LINE = '#C9C9CF';
  const hl = (x1, x2, y, dash) => lines.push(`<path d="M ${x1} ${y} L ${x2} ${y}" ${dash ? 'stroke-dasharray="5 5"' : ''}/>`);
  const vl = (x, y1, y2) => lines.push(`<path d="M ${x} ${y1} L ${x} ${y2}"/>`);
  const dot = (x, y) => dots.push(`<span aria-hidden="true" style="position:absolute;left:${x - 6}px;top:${y - 6}px;width:12px;height:12px;border-radius:99px;background:#fff;border:1.5px solid ${LINE}"></span>`);
  const pill = (x, y, txt, dark = true) => { const w = Math.round(txt.length * 7.2 + 26); pills.push(`<span style="position:absolute;left:${x - w / 2}px;top:${y - 36}px;width:${w}px;height:26px;border-radius:99px;background:${dark ? '#18181B' : '#fff'};color:${dark ? '#fff' : 'var(--ink3)'};border:${dark ? '0' : '1px solid var(--line2)'};font-size:12px;display:flex;align-items:center;justify-content:center;white-space:nowrap">${esc(txt)}</span>`); };
  const STG = { research: ['#DCEBE5', '#0B5A40', VIEWS.research.icon], concept: ['#EDE4FE', '#4B2A8A', VIEWS.conceptos.icon], comp: ['#27272A', '#FFFFFF', VIEWS.competidores.icon], create: ['#56C89F', '#0B3B2C', I.biblioteca], result: ['#D8C7FD', '#2E1A5C', I.check] };
  const chip = (k, s = 24) => `<span aria-hidden="true" style="width:${s}px;height:${s}px;flex:0 0 ${s}px;border-radius:7px;background:${STG[k][0]};color:${STG[k][1]};display:inline-flex;align-items:center;justify-content:center">${IC(STG[k][2], 13)}</span>`;
  const head = (k, title, meta = '') => `<span style="display:flex;align-items:center;gap:8px">${chip(k)}<span style="font-size:13px;font-weight:600">${title}</span><span style="margin-left:auto;font-size:12px" class="muted">${meta}</span></span>`;
  const card = (x, cy, h, inner, act, faded, border) => cards.push(`<${act ? `button ${act}` : 'div'} class="mapcard" style="position:absolute;left:${x}px;top:${cy - h / 2}px;width:${W}px;height:${h}px;${faded ? 'opacity:.55;' : ''}${border ? `border-color:${border};` : ''}">${inner}</${act ? 'button' : 'div'}>`);
  const thumbs = (arr, h = 40) => `<span style="display:flex;gap:6px">${arr.slice(0, 5).map((u) => `<span aria-hidden="true" style="flex:1;height:${h}px;border-radius:6px;background:${u.bg || 'var(--lav-tint)'} ${u.src ? `url('${u.src}') center/cover` : ''}"></span>`).join('')}</span>`;

  // Research
  const bySrc = {};
  refs.forEach((r) => { bySrc[r.source] = (bySrc[r.source] || 0) + 1; });
  const rCY = TOP + (n * ROWH) / 2 - 10;
  const RH = Math.min(300, n * ROWH - 30);
  card(COLS[0], rCY, RH, head('research', 'Swipe file', `${refs.length} ${refs.length === 1 ? 'ref' : 'refs'}`) +
    `<span class="row" style="gap:4px">${Object.entries(bySrc).map(([s, k]) => `<span class="tag">${esc(s.replace(' Creative Center', '').replace(' Ad Library', ''))} · ${k}</span>`).join('') || '<span class="small muted">Sin referencias todavía</span>'}</span>` +
    (refs.length ? thumbs(refs.filter((r) => r.blob).map((r) => ({ src: refURL(r) })), 54) : '') +
    `<span class="small" style="line-height:1.45"><span class="muted">Insight clave:</span> ${esc(camp.insight || 'Toca para escribir el insight de la campaña')}</span>`, 'data-act="map-insight"');
  // Concepts rows
  const fanX = COLS[0] + W + GAP / 2;
  if (concepts.length) {
    hl(COLS[0] + W, fanX, rCY); dot(COLS[0] + W, rCY);
    vl(fanX, Math.min(rowY(0), rCY), Math.max(rowY(concepts.length - 1), rCY));
  }
  concepts.forEach((c, i) => {
    const y = rowY(i), st = c.status || 'explorando', disc = st === 'descartado';
    hl(fanX, COLS[1], y, disc); dot(COLS[1], y);
    card(COLS[1], y, 180, head('concept', 'Concepto', `<b style="font-weight:600;color:${st === 'elegido' ? 'var(--mint-dark)' : 'inherit'}">${CSTATUS[st].label.replace(/s$/, '')}</b>`) +
      `<b style="font-size:15px;font-weight:600;line-height:1.3" class="clamp">${esc(c.name)}</b>
      <span class="row" style="gap:4px">${c.fields.angle ? `<span class="tag lav">${esc(c.fields.angle)}</span>` : ''}<span class="tag">v${(c.versions || []).length || 1}</span></span>
      <span class="small clamp muted">${esc(c.fields.message || c.fields.insight || '')}</span>`, `data-act="concept-open" data-id="${c.id}"`, disc, st === 'elegido' ? 'var(--mint)' : '');
    if (disc) return;
    // Competitors with same angle
    const comp = S.refs.filter((r) => c.fields.angle && refAngles(r).includes(c.fields.angle) && r.brand && (!camp.clientId || !clientById(camp.clientId) || r.brand.toLowerCase() !== clientById(camp.clientId).name.toLowerCase()));
    const brands = [...new Set(comp.map((r) => r.brand))];
    const fmts = {}; comp.forEach((r) => { const f = refFormat(r); if (f) fmts[f] = (fmts[f] || 0) + 1; });
    const topFmt = Object.entries(fmts).sort((a, b) => b[1] - a[1])[0];
    hl(COLS[1] + W, COLS[2], y); dot(COLS[1] + W, y); dot(COLS[2], y); pill((COLS[1] + W + COLS[2]) / 2, y, 'por ángulo');
    card(COLS[2], y, 180, head('comp', 'Ángulo: ' + esc(c.fields.angle || 'sin definir'), `${comp.length} ${comp.length === 1 ? 'ad' : 'ads'}`) +
      `<b style="font-size:14px;font-weight:600" class="clamp">${esc(brands.slice(0, 3).join(' · ') || 'Sin referencias con este ángulo')}</b>
      <span class="row" style="gap:4px">${topFmt ? `<span class="tag">Más ${esc(topFmt[0])}</span>` : ''}</span>
      <span class="small clamp" style="line-height:1.45">${c.compNote ? `<b style="font-weight:600;color:var(--mint-dark)">Oportunidad:</b> ${esc(c.compNote)}` : comp.length ? '<span style="color:var(--purple);font-weight:600">Toca para generar la lectura de oportunidad</span>' : '<span class="muted">Guarda ads con este ángulo en Research</span>'}</span>`,
      comp.length ? `data-act="map-comp" data-id="${c.id}"` : '');
    // Creation
    const imgs = conceptImages(c.id);
    const byModel = {}; imgs.forEach((im) => { byModel[im.model] = (byModel[im.model] || 0) + 1; });

  return [...names.values()].map((b) => ({ ...b, refs: S.refs.filter((r) => r.brand && r.brand.toLowerCase() === b.name.toLowerCase()) }));
